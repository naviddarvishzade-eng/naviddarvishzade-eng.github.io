<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خانه مهر | هنر و محصولات دست‌ساز</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#fffaf5;
  color:#3f3028;
  line-height:1.8;
}

nav{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,250,245,.96);
  border-bottom:1px solid #eadbd0;
  padding:14px 6%;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:23px;
  font-weight:bold;
  color:#9b5c45;
}

nav ul{
  display:flex;
  gap:24px;
  list-style:none;
}

nav a{
  text-decoration:none;
  color:#5d4037;
  font-size:14px;
}

.hero{
  max-width:1100px;
  margin:35px auto;
  padding:75px 25px;
  text-align:center;
  border-radius:30px;
  background:linear-gradient(135deg,#f8d8c8,#f6eadf);
  box-shadow:0 12px 35px rgba(90,55,40,.08);
}

.hero-icon{
  font-size:55px;
}

.hero h1{
  font-size:clamp(42px,8vw,72px);
  color:#784936;
  margin-bottom:8px;
}

.hero p{
  font-size:18px;
  color:#684f45;
  max-width:650px;
  margin:auto;
}

.btn{
  display:inline-block;
  margin-top:28px;
  padding:12px 28px;
  background:#9b5c45;
  color:#fff;
  text-decoration:none;
  border-radius:50px;
}

.section{
  max-width:1100px;
  margin:70px auto;
  padding:0 25px;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h2{
  font-size:32px;
  color:#704638;
}

.title p{
  color:#8b756b;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.card{
  background:#fff;
  border:1px solid #eee0d7;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(70,45,35,.06);
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
}
