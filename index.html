<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خانه مهر | گالری هنری نوید</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;700&display=swap');
        
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            margin: 0; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh; color: #333; text-align: center;
        }
        header { padding: 80px 20px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.3); }
        h1 { font-size: 3.5rem; margin: 0; color: #4a4a4a; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 40px; max-width: 1000px; margin: auto; }
        .card { 
            background: rgba(255, 255, 255, 0.7); padding: 30px; border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-10px); }
        footer { padding: 40px; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <header>
        <h1>خانه مهر</h1>
        <p>تجلی هنر در سفال و آبرنگ - اثر نوید</p>
    </header>
    
    <main class="gallery">
        <div class="card"><h3>سفالگری</h3><p>طراحی‌های دست‌ساز با الهام از طبیعت</p></div>
        <div class="card"><h3>آبرنگ</h3><p>نقش‌ و نگارهای رنگارنگ و مدرن</p></div>
        <div class="card"><h3>سفارش</h3><p>ارسال به سراسر کشور با بسته‌بندی امن</p></div>
    </main>
    
    <footer>
        <p>© ۱۴۰۴ | تمامی حقوق برای خانه مهر محفوظ است.</p>
    </footer>
</body>
</html>
