<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f0e8">
<meta name="description" content="خانه مهر | گالری هنری نوید">
<title> خانه مهر </title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

:root{
  --paper:#f5f0e8;
  --paper2:#eee7dc;
  --ink:#20201d;
  --muted:#77736b;
  --line:rgba(32,32,29,.13);
  --gold:#a98249;
  --dark:#20201d;
  --white:#fffdf9;
  --serif:"Playfair Display",Georgia,serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Vazirmatn",Tahoma,sans-serif;
  line-height:1.9;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

.container{
  width:min(1160px,calc(100% - 40px));
  margin:auto;
}

/* ظرافت کاغذی سایت */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}

/* ================= HEADER ================= */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
  padding:17px 0;
  background:rgba(245,240,232,.78);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(32,32,29,.08);
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:700;
  letter-spacing:-.5px;
}

.logo-mark{
  width:38px;
  height:38px;
  border:1px solid var(--ink);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-family:var(--serif);
  font-size:17px;
}

.logo small{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:400;
  line-height:1;
}

.links{
  display:flex;
  gap:28px;
  font-size:13px;
  color:#5d5952;
}

.links a{
  transition:.25s;
}

.links a:hover{
  color:var(--gold);
}

.nav-cta{
  border:1px solid var(--ink);
  padding:8px 16px;
  border-radius:100px;
  font-size:12px;
  transition:.25s;
}

.nav-cta:hover{
  background:var(--ink);
  color:var(--white);
}

/* ================= HERO ================= */

.hero{
  min-height:100vh;
  padding:145px 0 70px;
  display:grid;
  align-items:center;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.02fr .98fr;
  gap:80px;
  align-items:center;
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--gold);
  font-size:12px;
  font-weight:600;
  margin-bottom:22px;
}
