<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>خانه مهر یزد</title>

<meta name="description"
content="خانه مهر یزد | سفال، مانتو، سنگ مصنوعی و محصولات حیوانات خانگی">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">


<style>

/* =========================
   ROOT
========================= */

:root{

--purple:#8b5cf6;
--pink:#ec4899;
--red:#ef4444;
--orange:#f97316;
--yellow:#facc15;
--green:#22c55e;
--cyan:#06b6d4;
--blue:#3b82f6;

--dark:#24172f;
--gray:#75677f;
--white:#ffffff;

--background:#fff8fc;

}


/* =========================
   RESET
========================= */

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{

font-family:"Vazirmatn",sans-serif;

background:
radial-gradient(circle at 10% 10%,#ffe4f2 0,transparent 25%),
radial-gradient(circle at 90% 20%,#e4dcff 0,transparent 25%),
radial-gradient(circle at 50% 100%,#d9fff3 0,transparent 25%),
var(--background);

color:var(--dark);

overflow-x:hidden;

}

button,
input{
font-family:inherit;
}


/* =========================
   CONTAINER
========================= */

.container{

width:min(
1200px,
calc(100% - 30px)
);

margin:auto;

}


/* =========================
   HEADER
========================= */

header{

position:relative;

min-height:700px;

overflow:hidden;

background:
linear-gradient(
135deg,
#ffedf7,
#f1eaff 45%,
#e0f8ff
);

}

header::before{

content:"";

position:absolute;

width:350px;
height:350px;

background:#ff75b5;

border-radius:50%;

filter:blur(80px);

opacity:.25;

top:-150px;
right:-100px;

}

header::after{

content:"";

position:absolute;

width:300px;
height:300px;

background:#4ade80;

border-radius:50%;

filter:blur(90px);

opacity:.2;

bottom:-100px;
left:-100px;

}


/* =========================
   NAV
========================= */

nav{

height:90px;

display:flex;

align-items:center;

justify-content:space-between;

position:relative;

z-index:10;

}

.logo{

display:flex;

align-items:center;

gap:12px;

text-decoration:none;

color:var(--dark);

}

.logo-icon{

width:55px;
height:55px;

display:grid;

place-items:center;

border-radius:20px;

font-size:27px;

font-weight:900;

color:white;

background:
linear-gradient(
135deg,
var(--purple),
var(--pink),
var(--orange)
);

box-shadow:
0 12px 30px #ec489955;

}

.logo-text strong{

display:block;

font-size:19px;

}

.logo-text small{

display:block;

font-size:11px;

color:var(--gray);

}

.nav-buttons{

display:flex;

gap:10px;

}

.nav-button{

border:0;

padding:11px 17px;

border-radius:15px;

cursor:pointer;

font-weight:700;

background:white;

color:var(--dark);

box-shadow:0 8px 25px #4b1b6712;

transition:.25s;

text-decoration:none;

}

.nav-button:hover{

transform:translateY(-3px);

}

.nav-button.order{

background:
linear-gradient(
135deg,
var(--pink),
var(--red)
);

color:white;

}


/* =========================
   HERO
========================= */

.hero{

position:relative;

z-index:2;

display:grid;

grid-template-columns:1fr 1fr;

align-items:center;

min-height:570px;

gap:40px;

}

.hero-text{

max-width:620px;

}

.small-title{

display:inline-flex;

align-items:center;

gap:7px;

padding:9px 15px;

border-radius:30px;

background:white;

color:var(--purple);

font-size:13px;

font-weight:800;

box-shadow:0 10px 30px #6b3d8714;

}

.hero h1{

font-size:clamp(42px,6vw,76px);

line-height:1.15;

margin:22px 0;

font-weight:900;

letter-spacing:-2px;

}

.hero h1 .pink{
color:var(--pink);
}

.hero h1 .purple{
color:var(--purple);
}

.hero h1 .orange{
color:var(--orange);
}

.hero-text p{

font-size:17px;

line-height:2;

color:var(--gray);

margin-bottom:25px;

}

.hero-buttons{

display:flex;

gap:12px;

flex-wrap:wrap;

}

.big-button{

border:0;

padding:16px 23px;

border-radius:18px;

cursor:pointer;

font-weight:800;

font-size:14px;

transition:.25s;

text-decoration:none;

display:inline-flex;

align-items:center;

gap:10px;

}

.big-button:hover{

transform:
translateY(-4px)
scale(1.02);

}

.button-purple{

color:white;

background:
linear-gradient(
135deg,
var(--purple),
#6366f1
);

box-shadow:
0 12px 30px #8b5cf655;

}

.button-pink{

color:white;

background:
linear-gradient(
135deg,
var(--pink),
var(--red)
);

box-shadow:
0 12px 30px #ec489955;

}

.button-yellow{

background:var(--yellow);

color:#4a3100;

box-shadow:
0 12px 30px #facc1540;

}


/* =========================
   HERO ART
========================= */

.hero-art{

height:450px;

position:relative;

}

.floating-card{

position:absolute;

width:180px;
height:210px;

display:flex;

align-items:center;

justify-content:center;

font-size:75px;

border-radius:35px;

border:9px solid white;

box-shadow:
0 25px 60px #3c255225;

animation:float 5s ease-in-out infinite;

}

.card-one{

right:220px;
top:40px;

background:
linear-gradient(
135deg,
#ffd0e5,
#ff9ac7
);

transform:rotate(-9deg);

}

.card-two{

right:30px;
top:120px;

background:
linear-gradient(
135deg,
#d8ccff,
#a78bfa
);

transform:rotate(10deg);

animation-delay:1s;

}

.card-three{

right:100px;
top:0;

background:
linear-gradient(
135deg,
#c7f9e5,
#4ade80
);

transform:rotate(3deg);

animation-delay:2s;

}

.card-four{

right:180px;
top:230px;

background:
linear-gradient(
135deg,
#ffe7a8,
#fb923c
);

transform:rotate(8deg);

animation-delay:1.5s;

}

@keyframes float{

0%,100%{
transform:translateY(0) rotate(-5deg);
}

50%{
transform:translateY(-15px) rotate(-2deg);
}

}


/* =========================
   SEARCH
========================= */

.search-area{

position:relative;

z-index:20;

margin-top:-50px;

}

.search-box{

background:white;

padding:9px;

border-radius:25px;

display:flex;

align-items:center;

gap:10px;

box-shadow:
0 20px 55px #4b1b6720;

border:3px solid #ffffff;

}

.search-icon{

width:55px;
height:55px;

display:grid;

place-items:center;

border-radius:18px;

background:
linear-gradient(
135deg,
#ddd6fe,
#fbcfe8
);

font-size:25px;

}

.search-box input{

flex:1;

border:0;

outline:0;

font-size:16px;

background:transparent;

padding:0 10px;

}

.search-button{

border:0;

padding:15px 23px;

border-radius:17px;

background:
linear-gradient(
135deg,
var(--purple),
var(--pink)
);

color:white;

font-weight:800;

cursor:pointer;

}


/* =========================
   CATEGORIES
========================= */

.section-title{

display:flex;

justify-content:space-between;

align-items:end;

margin:65px 0 25px;

}

.section-title h2{

font-size:32px;

font-weight:900;

}

.section-title p{

color:var(--gray);

font-size:13px;

margin-top:5px;

}

.categories{

display:grid;

grid-template-columns:repeat(5,1fr);

gap:15px;

}

.category{

border:0;

cursor:pointer;

border-radius:25px;

padding:20px 12px;

background:white;

box-shadow:0 10px 35px #4b1b6710;

transition:.3s;

position:relative;

overflow:hidden;

}

.category:hover{

transform:translateY(-7px);

box-shadow:0 20px 40px #4b1b6720;

}

.category.active{

outline:4px solid #8b5cf633;

transform:translateY(-5px);

}

.category-icon{

width:60px;
height:60px;

display:grid;

place-items:center;

margin:auto;

border-radius:20px;

font-size:29px;

margin-bottom:10px;

}

.category strong{

display:block;

font-size:14px;

}

.category small{

display:block;

margin-top:4px;

color:var(--gray);

font-size:10px;

}

.cat-all .category-icon{
background:#ede9fe;
}

.cat-pottery .category-icon{
background:#fed7aa;
}

.cat-manto .category-icon{
background:#fbcfe8;
}

.cat-stone .category-icon{
background:#bae6fd;
}

.cat-pets .category-icon{
background:#bbf7d0;
}


/* =========================
   SPECIAL
========================= */

.special{

margin-top:55px;

padding:30px;

border-radius:30px;

background:
linear-gradient(
120deg,
#7c3aed,
#ec4899,
#f97316,
#facc15
);

background-size:300% 300%;

animation:gradient 8s ease infinite;

color:white;

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

box-shadow:
0 20px 50px #ec489955;

}

@keyframes gradient{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

.special h3{

font-size:25px;

margin-bottom:7px;

}

.special p{

font-size:12px;

opacity:.9;

}

.special-button{

background:white;

color:var(--purple);

border:0;

padding:14px 20px;

border-radius:16px;

font-weight:900;

cursor:pointer;

}



 /* =========================
 
   PRODUCTS

</style>

</head>

</body>

</html>
